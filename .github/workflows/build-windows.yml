name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang lld libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check -p zed_actions -p sidebar -p agent_ui -p agent -p glm -p language_models -p zai_proxy_sidecar
  build-windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest runners ship with rustup pre-installed. We just need
      # to trigger installation of the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          # Ensure cargo bin dir is on PATH for subsequent steps
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not ($env:PATH -split ';' -contains $cargoBin)) {
              $env:PATH = "$cargoBin;$env:PATH"
              echo "$cargoBin" >> $env:GITHUB_PATH
          }
          # Trigger toolchain install from rust-toolchain.toml
          rustup show
          rustc -vV
          cargo --version

      - name: Set up MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        shell: pwsh
        run: |
          $cmakeVersion = "3.30.5"
          $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip"
          $cmakeZipPath = "$env:TEMP\cmake.zip"
          $cmakeExtractPath = "$env:TEMP\cmake"

          $downloaded = $false
          for ($i = 1; $i -le 5; $i++) {
              curl.exe -L --connect-timeout 30 --max-time 600 --retry 5 --retry-delay 5 `
                  -o "$cmakeZipPath" "$cmakeUrl"
              if ($LASTEXITCODE -eq 0) {
                  $downloaded = $true
                  break
              }
              Write-Host "CMake download attempt $i failed, retrying in 15s..."
              Start-Sleep -Seconds 15
          }
          if (-not $downloaded) {
              Write-Host "ERROR: Failed to download CMake after 5 attempts"
              exit 1
          }

          Expand-Archive -Path "$cmakeZipPath" -DestinationPath "$cmakeExtractPath" -Force
          $cmakeBinPath = "$cmakeExtractPath\cmake-$cmakeVersion-windows-x86_64\bin"

          $env:PATH = "$cmakeBinPath;$env:PATH"
          echo "$cmakeBinPath" >> $env:GITHUB_PATH

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\path\bin"
          if (Test-Path $mingwPath) {
              $env:PATH = "$mingwPath;$env:PATH"
              echo "$mingwPath" >> $env:GITHUB_PATH
          } else {
              Write-Host "WARNING: MinGW path not found at expected location"
          }

      - name: Verify build tools
        shell: pwsh
        run: |
          Write-Host "=== Build Tools ==="
          rustc --version
          cargo --version
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          Write-Host "INCLUDE=$env:INCLUDE"
          Write-Host "LIB=$env:LIB"
          Write-Host "==================="

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'   # matches vendor/zai-proxy go.mod

      - name: Build zai-proxy sidecar
        shell: bash
        env:
          ZAI_KEY_WDC: ${{ secrets.ZAI_KEY_WDC }}
          ZAI_KEY_WRAP: ${{ secrets.ZAI_KEY_WRAP }}
          ZAI_DUANE_ID: ${{ secrets.ZAI_DUANE_ID }}
          ZAI_DUANE_SECRET: ${{ secrets.ZAI_DUANE_SECRET }}
          ZAI_BRIDGE_ACCESS_KEY: ${{ secrets.ZAI_BRIDGE_ACCESS_KEY }}
          ZAI_BRIDGE_SECRET_KEY: ${{ secrets.ZAI_BRIDGE_SECRET_KEY }}
          ZAI_ALIYUN_ACCESS_KEY: ${{ secrets.ZAI_ALIYUN_ACCESS_KEY }}
          ZAI_ALIYUN_SECRET_KEY: ${{ secrets.ZAI_ALIYUN_SECRET_KEY }}
        run: |
          # Produces zai-proxy-windows-amd64 + q-bless-windows-amd64 under
          # crates/zai_proxy_sidecar/binaries/ for build.rs to embed.
          ./scripts/build-zai-proxy-sidecar.sh x86_64-pc-windows-msvc
          ls -lah crates/zai_proxy_sidecar/binaries/

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "zagent-windows-v2"
          workspaces: "."
          shared-key: "windows-release-v2"
          cache-on-failure: true

      - name: Build
        shell: pwsh
        run: |
          cargo build --release -p zed --target x86_64-pc-windows-msvc
        timeout-minutes: 240

      - name: Verify binary exists
        shell: pwsh
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/zagent.exe"
          if (Test-Path $binary) {
              Write-Host "Binary found: $binary"
              $size = (Get-Item $binary).Length / 1MB
              Write-Host "Size: $([math]::Round($size, 2)) MB"
          } else {
              Write-Host "ERROR: Binary not found at $binary"
              exit 1
          }

      - name: Download ConPTY (OpenConsole + conpty.dll)
        shell: pwsh
        run: |
          # ConPTY NuGet package from Microsoft Terminal v1.23.13503.0.
          # Without these files, zagent.exe cannot spawn a shell on Windows.
          $termUrl = "https://github.com/microsoft/terminal/releases/download/v1.23.13503.0/Microsoft.Windows.Console.ConPTY.1.23.251216003.nupkg"
          $nupkgPath = "$env:TEMP\conpty.nupkg"
          $nupkgExtractPath = "$env:TEMP\conpty"

          $downloaded = $false
          for ($i = 1; $i -le 5; $i++) {
              curl.exe -L --connect-timeout 30 --max-time 600 --retry 5 --retry-delay 5 `
                  -o "$nupkgPath" "$termUrl"
              if ($LASTEXITCODE -eq 0 -and (Get-Item $nupkgPath).Length -gt 10000) {
                  $downloaded = $true
                  break
              }
              Write-Host "ConPTY download attempt $i failed, retrying in 15s..."
              Start-Sleep -Seconds 15
          }
          if (-not $downloaded) {
              Write-Host "ERROR: Failed to download ConPTY after 5 attempts"
              exit 1
          }

          # .nupkg is a zip — rename and extract
          $zipPath = "$env:TEMP\conpty.zip"
          Copy-Item $nupkgPath $zipPath -Force
          Expand-Archive -Path "$zipPath" -DestinationPath "$nupkgExtractPath" -Force

          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          # x64 runtime files
          $openConsole = "$nupkgExtractPath\build\native\runtimes\x64\OpenConsole.exe"
          $conptyDll = "$nupkgExtractPath\runtimes\win-x64\native\conpty.dll"

          if (-not (Test-Path $openConsole) -or -not (Test-Path $conptyDll)) {
              Write-Host "ERROR: OpenConsole.exe or conpty.dll not found in ConPTY package"
              exit 1
          }

          Copy-Item $openConsole -Destination "$releaseDir\OpenConsole.exe" -Force
          Copy-Item $conptyDll -Destination "$releaseDir\conpty.dll" -Force
          Write-Host "Bundled OpenConsole.exe: $([math]::Round((Get-Item "$releaseDir\OpenConsole.exe").Length / 1KB, 1)) KB"
          Write-Host "Bundled conpty.dll: $([math]::Round((Get-Item "$releaseDir\conpty.dll").Length / 1KB, 1)) KB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zagent-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/zagent.exe
            target/x86_64-pc-windows-msvc/release/OpenConsole.exe
            target/x86_64-pc-windows-msvc/release/conpty.dll
          compression-level: 6
          retention-days: 14
