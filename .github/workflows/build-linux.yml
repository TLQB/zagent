name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang lld libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check -p zed_actions -p sidebar -p agent_ui -p agent -p glm -p language_models
  build-linux:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    container:
      image: ubuntu:20.04
      options: --user root
    
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: l
      HOME: /root
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Install basic tools
        run: |
          # Mirrors occasionally reset the connection; retry instead of
          # failing the whole build.
          for i in 1 2 3; do
            apt-get update && break
            if [ "$i" = 3 ]; then echo "ERROR: apt-get update failed"; exit 1; fi
            echo "apt-get update attempt $i failed, retrying in 15s"
            sleep 15
          done
          for i in 1 2 3; do
            apt-get install -y curl git ca-certificates gnupg lsb-release sudo && break
            if [ "$i" = 3 ]; then echo "ERROR: apt-get install failed"; exit 1; fi
            echo "apt-get install attempt $i failed, retrying in 15s"
            sleep 15
          done

      - name: Verify Ubuntu 20.04 environment
        run: |
          echo "=== Environment Verification ==="
          echo "HOME=$HOME"
          OS=$(grep PRETTY_NAME /etc/os-release)
          echo "OS: $OS"
          if echo "$OS" | grep -q "20.04"; then
            echo "✅ Ubuntu 20.04 confirmed"
          else
            echo "❌ ERROR: Not Ubuntu 20.04!"
            exit 1
          fi
          GLIBC_VER=$(ldd --version 2>&1 | head -1 | awk '{print $NF}')
          echo "GLIBC: $GLIBC_VER"
          echo "================================="

      - name: Checkout
        uses: actions/checkout@v4

      # Must run before script/linux, whose `finalize` curls rustup with no
      # retries, and before the cache step, which shells out to `rustc -vV` and
      # silently disables itself when rustc is not on PATH.
      - name: Install Rust toolchain
        run: |
          if [ ! -x /root/.cargo/bin/rustup ]; then
            for i in 1 2 3 4 5; do
              curl --proto '=https' --tlsv1.2 -sSf \
                --connect-timeout 30 --max-time 180 \
                --retry 5 --retry-delay 5 --retry-connrefused \
                https://sh.rustup.rs -o /tmp/rustup-init.sh && break
              echo "rustup download attempt $i failed, retrying in 15s"
              rm -f /tmp/rustup-init.sh
              sleep 15
            done
            if [ ! -s /tmp/rustup-init.sh ]; then
              echo "ERROR: could not download the rustup installer"
              exit 1
            fi
            # `none` avoids installing an unused `stable`; the cargo/rustc
            # proxies pull the toolchain pinned in rust-toolchain.toml instead.
            sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal \
              --default-toolchain none
          fi
          # Put cargo on PATH for every later step, the cache action included.
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="/root/.cargo/bin:$PATH"
          rustc -vV
          cargo --version

      - name: Install Linux dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            ./script/linux && break
            if [ "$i" = 3 ]; then echo "ERROR: script/linux failed"; exit 1; fi
            echo "script/linux attempt $i failed, retrying in 20s"
            sleep 20
          done
          echo 'source "$HOME/.cargo/env"' >> /root/.bashrc

      - name: Install newer CMake
        run: |
          # wasmtime requires CMake >= 3.18, Ubuntu 20.04 only has 3.16
          apt-get install -y wget
          for i in 1 2 3; do
            wget -qO /tmp/kitware.asc --tries=3 --timeout=30 \
              https://apt.kitware.com/keys/kitware-archive-latest.asc && break
            if [ "$i" = 3 ]; then echo "ERROR: kitware key download failed"; exit 1; fi
            echo "kitware key download attempt $i failed, retrying in 15s"
            sleep 15
          done
          apt-key add /tmp/kitware.asc
          apt-get install -y software-properties-common
          apt-add-repository 'deb https://apt.kitware.com/ubuntu/ focal main'
          apt-get update
          apt-get install -y cmake
          cmake --version

      - name: Verify build tools
        run: |
          echo "=== Build Tools ==="
          echo "HOME=$HOME"
          rustc --version
          cargo --version
          clang-18 --version | head -1
          lld-18 --version | head -1
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "GLIBC: $(ldd --version 2>&1 | head -1)"
          echo "==================="

      - name: Free disk space (container-safe)
        # This job runs in a Docker container that SHARES the host runner
        # disk. Host-level cleanup actions don't help (different mount ns),
        # but GitHub bind-mounts the hosted toolcache into the container at
        # /__e and the runner tools at /__t — deleting their CONTENTS frees
        # real host disk. Rust caches are NOT restored for this job (a
        # multi-GB tarball restore was what filled the disk), so everything
        # below is pure headroom for the ~8GB target dir.
        run: |
          set -x
          df -h / | tail -1
          rm -rf /__e/* 2>/dev/null || true
          rm -rf /__t/* 2>/dev/null || true
          apt-get clean
          rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
          df -h / | tail -1

      - name: Install Go toolchain
        with:

      - name: Build zai-proxy sidecar
        env:
          ZAI_KEY_WDC: ${{ secrets.ZAI_KEY_WDC }}
          ZAI_KEY_WRAP: ${{ secrets.ZAI_KEY_WRAP }}
          ZAI_DUANE_ID: ${{ secrets.ZAI_DUANE_ID }}
          ZAI_DUANE_SECRET: ${{ secrets.ZAI_DUANE_SECRET }}
          ZAI_BRIDGE_ACCESS_KEY: ${{ secrets.ZAI_BRIDGE_ACCESS_KEY }}
          ZAI_BRIDGE_SECRET_KEY: ${{ secrets.ZAI_BRIDGE_SECRET_KEY }}
          ZAI_ALIYUN_ACCESS_KEY: ${{ secrets.ZAI_ALIYUN_ACCESS_KEY }}
          ZAI_ALIYUN_SECRET_KEY: ${{ secrets.ZAI_ALIYUN_SECRET_KEY }}
        run: |
          # Compiles the vendored Go proxy + q-bless into
          # the zagent binary (include_bytes!).
          go clean -modcache 2>/dev/null || true   # ~1GB back, deps no longer needed

      - name: Build
        run: |
          export CARGO_BUILD_JOBS=4
          df -h / | tail -1
          free -h | head -2
          cargo build --release -p zed
        timeout-minutes: 300
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"    # no debuginfo in rlibs/target
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
          CARGO_INCREMENTAL: "0"

      - name: Failure diagnostics
        if: failure()
        run: |
          echo '=== df ==='; df -h / | tail -1
          echo '=== free ==='; free -h
          echo '=== target size ==='; du -sh target 2>/dev/null || true
          echo '=== biggest dirs ==='; du -xh --max-depth=2 target 2>/dev/null | sort -rh | head -8

      - name: Verify GLIBC compatibility
        run: |
          echo "=== GLIBC Verification ==="
          BINARY="target/release/zagent"
          if [ ! -f "$BINARY" ]; then
            echo "❌ ERROR: Binary not found at $BINARY"
            exit 1
          fi
          GLIBC_REQ=$(strings "$BINARY" | grep -oP 'GLIBC_\d+\.\d+(\.\d+)?' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "Required GLIBC: $GLIBC_REQ"
          GLIBC_SYS=$(ldd --version 2>&1 | head -1 | awk '{print $NF}')
          echo "System GLIBC: $GLIBC_SYS"
          if [ "$(printf '%s\n' "$GLIBC_REQ" "$GLIBC_SYS" | sort -V | tail -1)" = "$GLIBC_SYS" ]; then
            echo "✅ Binary GLIBC requirement ($GLIBC_REQ) <= System GLIBC ($GLIBC_SYS)"
            echo "✅ Binary WILL run on Ubuntu 20.04+"
          else
            echo "❌ ERROR: Binary requires GLIBC $GLIBC_REQ but system has $GLIBC_SYS"
            echo "❌ Binary will NOT run on Ubuntu 20.04!"
            exit 1
          fi
          echo "==========================="

      - name: Strip binary
        run: |
          strip target/release/zagent
          ls -lah target/release/zagent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zagent-linux-x86_64
          path: target/release/zagent
          compression-level: 6
          retention-days: 14
